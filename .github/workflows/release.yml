name: Release CLI

# Runs on every push to main. When package.json has a version with no GitHub
# release yet, it builds the standalone binaries and attaches them to a DRAFT
# release v<version>. Nothing is public until a person reviews the draft on
# the releases page and clicks Publish: that creates the tag, and Publish to
# npm then publishes the package.
on:
  push:
    branches: [main]

concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Is this version already released?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A draft or published release for this version means there's nothing to do.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already has a release (draft or published); nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.release == 'true'
        with:
          bun-version: '1.3.10'

      - run: bun install
        if: steps.version.outputs.release == 'true'

      - run: bun run check:release
        if: steps.version.outputs.release == 'true'

      - run: bun test
        if: steps.version.outputs.release == 'true'

      - run: bun run build
        if: steps.version.outputs.release == 'true'

      - name: Build standalone binaries
        if: steps.version.outputs.release == 'true'
        run: bun run build:binary

      - name: Generate checksums
        if: steps.version.outputs.release == 'true'
        run: |
          cd dist
          sha256sum vidjutsu-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VidJutsu ${{ steps.version.outputs.tag }}
          draft: true
          generate_release_notes: true
          files: |
            dist/vidjutsu-darwin-arm64
            dist/vidjutsu-darwin-x64
            dist/vidjutsu-linux-x64
            dist/vidjutsu-linux-arm64
            dist/checksums.txt
