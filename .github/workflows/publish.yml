name: Publish to npm

# Runs when a release is published on GitHub. Release CLI drafts a release
# for each new version merged to main; a person reviews the draft on the
# releases page and clicks Publish, which creates the v<version> tag and
# publishes that version to npm here.
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: bun install

      # Fails if the release's tag isn't v<package.json version>.
      - run: bun run check:release

      - run: bun test

      - run: bun run build

      - run: npm publish --provenance --access public
